name: ci

on:
  push:
    branches: [main]
    # Skip CI on data-only commits (the daily worker writes to data/ — no point
    # re-running tests for that).
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        run: pip install -e .[dev]

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
